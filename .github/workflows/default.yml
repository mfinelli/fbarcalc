---
name: Default
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
      - run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - run: cargo fmt -- --check
      - run: cargo check --locked
      - run: cargo clippy --locked
      - run: cargo test --locked
      - run: cargo build --locked --release --verbose
      - run: ./vcheck.bash

  main-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}
      - run: |
          rustc --version
          cargo --version
      - run: cargo test --locked
      - run: cargo build --locked --release --verbose

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [main, main-macos]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: docker
        with:
          images: |
            mfinelli/fbarcalc
            ghcr.io/mfinelli/fbarcalc
          tags: type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.docker.outputs.tags }}
      - uses: peter-evans/dockerhub-description@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: mfinelli/fbarcalc
          short-description: ${{ github.event.repository.description }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [main, main-macos, docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: cargo vendor --locked
      - run: cargo doc --frozen --no-deps --release
      - run: cargo build --frozen --release
      - run: |
          cp target/release/fbarcalc .
          cp -r target/doc .
          rm -rfv doc/.lock
          tar acvf fbarcalc_${{ github.ref_name }}_linux_amd64.tar.zst \
            Cargo.{lock,toml} CHANGELOG.md LICENSE README.md doc fbarcalc \
            fbarcalc.1 src vendor
          gpg -ba fbarcalc_${{ github.ref_name }}_linux_amd64.tar.zst
      - uses: ncipollo/release-action@v1
        with:
          artifacts: fbarcalc_*.tar.*
          token: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: cargo vendor --locked
      - run: cargo doc --frozen --no-deps --release
      - run: cargo build --frozen --release
      - run: |
          cp target/release/fbarcalc .
          cp -r target/doc .
          rm -rfv doc/.lock
          tar acvf fbarcalc_${{ github.ref_name }}_macos_arm64.tar.zst \
            Cargo.{lock,toml} CHANGELOG.md LICENSE README.md doc fbarcalc \
            fbarcalc.1 src vendor
          gpg -ba fbarcalc_${{ github.ref_name }}_macos_arm64.tar.zst
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: fbarcalc_*.tar.*
          token: ${{ secrets.GITHUB_TOKEN }}
