---
name: Default
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  main:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos, ubuntu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - run: cargo fmt -- --check
      - run: cargo check --locked
      - run: cargo clippy --locked
      - run: cargo test --locked
      - run: cargo build --locked --release --verbose
      - run: cargo publish --dry-run
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu'
        with:
          name: crate
          path: target/package/tmp-crate/*.crate
          retention-days: 1
      - run: ./vcheck.bash

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [main]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: docker
        with:
          images: |
            mfinelli/fbarcalc
            ghcr.io/mfinelli/fbarcalc
          tags: type=semver,pattern={{version}}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.docker.outputs.tags }}
      - uses: peter-evans/dockerhub-description@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: mfinelli/fbarcalc
          short-description: ${{ github.event.repository.description }}

  build:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    needs: [docker]
    strategy:
      fail-fast: false
      matrix:
        os: [macos, ubuntu]
    steps:
      - name: Set OS name
        id: os
        run: >-
          echo "name=$(echo $RUNNER_OS | tr '[:upper:]' '[:lower:]')" >>
          $GITHUB_OUTPUT
      - name: Set arch
        id: arch
        run: |
          ARCH=$(uname -m)
          case $ARCH in
            x86_64)  echo "name=amd64" >> $GITHUB_OUTPUT ;;
            aarch64) echo "name=arm64" >> $GITHUB_OUTPUT ;;
            arm64)   echo "name=arm64" >> $GITHUB_OUTPUT ;;
            *)       echo "name=$ARCH" >> $GITHUB_OUTPUT ;;
          esac
      - name: Set ref name
        id: ref
        run: echo "name=${GITHUB_REF_NAME%%/*}" >> $GITHUB_OUTPUT
      - name: Set archive name
        id: archive
        run: |
          NAME="fbarcalc"
          NAME="${NAME}_${{ steps.ref.outputs.name }}"
          NAME="${NAME}_${{ steps.os.outputs.name }}"
          NAME="${NAME}_${{ steps.arch.outputs.name }}"
          NAME="${NAME}.tar.zst"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
      - name: Set tar
        id: tar
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            echo "cmd=gtar" >> $GITHUB_OUTPUT
          else
            echo "cmd=tar" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-import-gpg@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: cargo vendor --locked
      - run: cargo doc --frozen --no-deps --release
      - run: cargo build --frozen --release
      - run: |
          mkdir dist
          cp target/release/fbarcalc dist
          cp fbarcalc.1 Cargo.{lock,toml} README.md CHANGELOG.md LICENSE dist
          cp -r target/doc dist/
          rm -rfv dist/doc/.lock
          cp -r src dist/
          cp -r vendor dist/
      - run: |
          cd dist
          ${{ steps.tar.outputs.cmd }} --owner=0 --group=0 --sort=name -acvf \
            ../${{ steps.archive.outputs.name }} *
      - run: gpg -ba ${{ steps.archive.outputs.name }}
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v7
        with:
          name: release_${{ matrix.os }}
          path: fbarcalc_*.tar.*
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 7 || 1 }}
          overwrite: true

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release_*
          merge-multiple: true
          path: dist
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title
          "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
