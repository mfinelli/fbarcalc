[package]
name = "fbarcalc"
version = "1.0.1"
edition = "2024"

description = "Calculate maximum account balance for FBAR reports"
categories = ["command-line-utilities", "finance"]
keywords = ["fbar", "fincen", "tax", "currency", "calculator"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/mfinelli/fbarcalc"

include = [
  "/CHANGELOG.md",
  "/Cargo.*",
  "/LICENSE",
  "/README.md",
  "/fbarcalc.1",
  "/src/*",
  "/tests/*",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = { version = "7.0.0" }
inquire = { version = "0.9.4" }
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "query"] }
serde_json = { version = "1.0.153" }
toml_edit = { version = "0.25.17" }
